name: Baloot
options:
  bundleIdPrefix: com.baloot
  developmentLanguage: ar

settings:
  base:
    PRODUCT_NAME: Baloot
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Baloot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/Baloot
      - Sources/BalootCore
      - Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.baloot.calculator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
